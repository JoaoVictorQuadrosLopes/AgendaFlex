services:
  - type: web
    name: agendaflex-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://agenda-flex-woad.vercel.app
      - key: CORS_ORIGINS
        value: https://agenda-flex-woad.vercel.app
      - key: API_PUBLIC_URL
        value: https://agendaflex-api.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PROVIDER
        value: meta
      - key: WHATSAPP_GRAPH_VERSION
        value: v20.0
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_DEFAULT_EMPRESA_ID
        value: "1"

  - type: web
    name: agendaflex-web
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://agendaflex-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
